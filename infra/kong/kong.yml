_format_version: "3.0"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SECRET_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  # Public endpoints used by callbacks, email links and JWT verification.
  - name: auth-open-verify
    url: http://auth:9999/verify
    routes:
      - name: auth-open-verify-route
        paths: ["/auth/v1/verify"]
        strip_path: true

  - name: auth-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-open-callback-route
        paths: ["/auth/v1/callback"]
        strip_path: true

  - name: auth-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-open-authorize-route
        paths: ["/auth/v1/authorize"]
        strip_path: true

  - name: auth-open-jwks
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-open-jwks-route
        paths: ["/auth/v1/.well-known/jwks.json"]
        strip_path: true

  # Admin endpoints accept only the opaque secret key.
  - name: auth-admin
    url: http://auth:9999/admin/
    routes:
      - name: auth-admin-route
        paths: ["/auth/v1/admin/"]
        strip_path: true
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
              key_in_header: true
              key_in_query: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin]

  # Login, refresh, logout and user-management endpoints.
  - name: auth
    url: http://auth:9999/
    routes:
      - name: auth-route
        paths: ["/auth/v1/"]
        strip_path: true
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
              key_in_header: true
              key_in_query: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [admin, anon]

  - name: frontend
    url: http://frontend:8080
    routes:
      - name: frontend-root
        paths: ["/"]
        strip_path: false

  - name: api
    url: http://api:3000
    connect_timeout: 60000
    read_timeout: 3600000
    write_timeout: 3600000
    routes:
      - name: api-route
        paths: ["/api/"]
        strip_path: true
        plugins:
          - name: key-auth
            config:
              hide_credentials: false
              key_in_header: true
              key_in_query: false
          - name: request-transformer
            config:
              add:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
              replace:
                headers:
                  - "Authorization: $LUA_AUTH_EXPR"
          - name: acl
            config:
              hide_groups_header: true
              allow: [anon]

plugins:
  - name: cors
    config:
      origins: $KONG_PLUGINS_CORS_CONFIG_ORIGINS
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Profile
        - Authorization
        - Content-Type
        - Content-Profile
        - Origin
        - X-Client-Info
        - X-Requested-With
        - apikey
      exposed_headers: ["Content-Length", "Content-Type"]
      credentials: true
      preflight_continue: false
      max_age: 3600

  - name: response-transformer
    config:
      remove:
        headers:
          - "Server"
          - "X-Powered-By"
      add:
        headers:
          - "X-Frame-Options:DENY"
          - "X-Content-Type-Options:nosniff"
          #- "Cross-Origin-Embedder-Policy:require-corp"
          #- "Cross-Origin-Opener-Policy:same-origin"
          #- "Cross-Origin-Resource-Policy:same-origin"
          - "Referrer-Policy:strict-origin-when-cross-origin"
          - "Permissions-Policy:camera=(), microphone=(), geolocation=(), payment=(), usb=()"
          #- "Content-Security-Policy:default-src 'self'; script-src 'self'; style-src 'self' ; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8000 ws://localhost:8000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
